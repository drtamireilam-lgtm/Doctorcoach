name: DoctorCoach CI

on:
  push:
    branches: [main, "stabilize/**", "fix/appearance-toggle-persistence-*", "feature/ui-ux-liad-followup-20261019", "feature/doctorcoach-2-smart-workout-20261020", "feature/anatomy-completion-*", "integration/anatomy-rehab-stretch-*"]
  pull_request:
    branches: [main, "feature/anatomy-*", "integration/anatomy-*", "codex/anatomy-*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Foundation security tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PR refs are synthetic merge refs; use the source and target branch names too.
      ANATOMY_BROWSER_CHECKS: ${{ startsWith(github.ref_name, 'feature/anatomy-') || startsWith(github.ref_name, 'integration/anatomy-') || startsWith(github.head_ref, 'feature/anatomy-') || startsWith(github.head_ref, 'integration/anatomy-') || startsWith(github.base_ref, 'feature/anatomy-') || startsWith(github.base_ref, 'integration/anatomy-') || startsWith(github.base_ref, 'codex/anatomy-') }}
    defaults:
      run:
        working-directory: apps/doctorcoach-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked standalone dependencies
        run: pnpm install --frozen-lockfile
      - name: Standalone regression tests
        run: npm test
      - name: Standalone TypeScript
        run: npm run typecheck
      - name: Select runner anatomy browser
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        timeout-minutes: 1
        run: |
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          echo "ANATOMY_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
      - name: Anatomy viewer controls and bundled model smoke
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/viewer-controls-smoke.mjs
      - name: Full anatomy application browser smoke
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/browser-smoke.mjs
      - name: Anatomical exercise motion controls and lifecycle
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/exercise-motion-smoke.mjs
      - name: Reusable joint movement library and atlas lifecycle
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/joint-motion-smoke.mjs
      - name: Build standalone without deployment
        env:
          DC_ISOLATED_STAGING_BUILD: "true"
        run: npm run build:standalone
      - name: Verify isolated LAB deployment target
        run: node standalone/scripts/check-isolated-staging.mjs dist/server/wrangler.json
      - name: Synthetic Worker authentication and authorization checks
        run: node --experimental-strip-types standalone/scripts/runtime-smoke.mjs
      - name: Package verified isolated LAB candidate
        if: github.ref == 'refs/heads/feature/ui-ux-liad-followup-20261019' || github.head_ref == 'feature/lab-apple-anatomy-integration-20261020' || github.ref == 'refs/heads/feature/doctorcoach-2-smart-workout-20261020'
        run: |
          mkdir -p .sites-runtime/lab-release
          git rev-parse HEAD > .sites-runtime/lab-release/source-commit.txt
          node standalone/scripts/candidate-hash.mjs . > .sites-runtime/lab-release/source-hash.txt
          tar -czf .sites-runtime/lab-release/lab-candidate.tgz dist
          sha256sum .sites-runtime/lab-release/lab-candidate.tgz > .sites-runtime/lab-release/SHA256SUMS
      - name: Save verified LAB candidate without deployment
        if: github.ref == 'refs/heads/feature/ui-ux-liad-followup-20261019' || github.head_ref == 'feature/lab-apple-anatomy-integration-20261020' || github.ref == 'refs/heads/feature/doctorcoach-2-smart-workout-20261020'
        uses: actions/upload-artifact@v4
        with:
          name: isolated-lab-candidate-${{ github.sha }}
          path: apps/doctorcoach-standalone/.sites-runtime/lab-release/
          include-hidden-files: true
          retention-days: 7
