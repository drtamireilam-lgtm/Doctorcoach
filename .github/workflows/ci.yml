name: DoctorCoach CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/lab-team-management, "feature/anatomy-bilingual-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Foundation security tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Build isolated anatomy prototype
        run: npm run anatomy:build
