name: DoctorCoach CI

on:
  push:
    branches: [main, "feature/doctorcoach-premium-ui-3", "codex/integration-59-60-61-*", "audit/full-lab-*", "feature/premium-home-ui-*", "fix/consultation-calendar-*", "codex/trainee-guidance-*", "codex/user-team-management-*", "codex/consultation-management-*", "feature/cardio-automatic-steps-*", "codex/exercise-recognition-3-*", "codex/import-integration-lab-*", "codex/application-audit-*", "stabilize/**", "fix/appearance-toggle-persistence-*", "feature/ui-ux-liad-followup-20261019", "feature/doctorcoach-2-smart-workout-20261020", "feature/anatomy-completion-*", "integration/anatomy-rehab-stretch-*"]
  pull_request:
    branches: [main, "codex/integration-59-60-61-*", "audit/full-lab-*", "feature/premium-home-ui-*", "fix/consultation-calendar-*", "codex/trainee-guidance-*", "codex/user-team-management-*", "codex/consultation-management-*", "feature/cardio-automatic-steps-*", "codex/exercise-recognition-3-*", "codex/import-integration-lab-*", "codex/generic-movement-import-*", "codex/application-audit-*", "codex/import-structure-regressions-*", "codex/import-alias-precision-*", "codex/google-apple-signin-*", "feature/anatomy-*", "integration/anatomy-*", "codex/anatomy-*", "codex/smart-import-3-*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Foundation security tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAB_AUDIT: ${{ startsWith(github.ref_name, 'codex/integration-59-60-61-') || startsWith(github.ref_name, 'audit/full-lab-') || startsWith(github.head_ref, 'codex/integration-59-60-61-') || startsWith(github.head_ref, 'audit/full-lab-') }}
      CARDIO_CHECKS: ${{ startsWith(github.ref_name, 'codex/integration-59-60-61-') || startsWith(github.ref_name, 'audit/full-lab-') || startsWith(github.head_ref, 'codex/integration-59-60-61-') || startsWith(github.head_ref, 'audit/full-lab-') || startsWith(github.ref_name, 'feature/cardio-automatic-steps-') || startsWith(github.head_ref, 'feature/cardio-automatic-steps-') }}
      # PR refs are synthetic merge refs; use the source and target branch names too.
      ANATOMY_BROWSER_CHECKS: ${{ startsWith(github.ref_name, 'codex/integration-59-60-61-') || startsWith(github.ref_name, 'audit/full-lab-') || startsWith(github.head_ref, 'codex/integration-59-60-61-') || startsWith(github.head_ref, 'audit/full-lab-') || startsWith(github.ref_name, 'codex/application-audit-') || startsWith(github.head_ref, 'codex/application-audit-') || startsWith(github.ref_name, 'feature/anatomy-') || startsWith(github.ref_name, 'integration/anatomy-') || startsWith(github.head_ref, 'feature/anatomy-') || startsWith(github.head_ref, 'integration/anatomy-') || startsWith(github.base_ref, 'feature/anatomy-') || startsWith(github.base_ref, 'integration/anatomy-') || startsWith(github.base_ref, 'codex/anatomy-') }}
    defaults:
      run:
        working-directory: apps/doctorcoach-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked standalone dependencies
        run: pnpm install --frozen-lockfile
      - name: Premium UI 3 local visual and interaction checks
        if: github.head_ref == 'feature/doctorcoach-premium-ui-3' || github.ref_name == 'feature/doctorcoach-premium-ui-3'
        env:
          DC_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/premium-ui-3-browser-smoke.mjs
      - name: Save Premium UI 3 screenshots
        if: always() && (github.head_ref == 'feature/doctorcoach-premium-ui-3' || github.ref_name == 'feature/doctorcoach-premium-ui-3')
        uses: actions/upload-artifact@v4
        with:
          name: premium-ui-3-visual-evidence
          path: apps/doctorcoach-standalone/.sites-runtime/ui3-evidence
      - name: Standalone regression tests
        run: npm test
      - name: Consultation desktop and mobile bilingual workflow
        if: env.LAB_AUDIT == 'true' || startsWith(github.head_ref, 'fix/consultation-calendar-') || startsWith(github.ref_name, 'fix/consultation-calendar-') || startsWith(github.head_ref, 'codex/trainee-guidance-') || startsWith(github.ref_name, 'codex/trainee-guidance-') || startsWith(github.head_ref, 'codex/consultation-management-') || startsWith(github.head_ref, 'codex/user-team-management-')
        env:
          CONSULTATION_CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/consultation-browser-smoke.mjs
      - name: User management desktop and mobile bilingual workflow
        if: env.LAB_AUDIT == 'true' || startsWith(github.head_ref, 'fix/consultation-calendar-') || startsWith(github.ref_name, 'fix/consultation-calendar-') || startsWith(github.head_ref, 'codex/trainee-guidance-') || startsWith(github.ref_name, 'codex/trainee-guidance-') || startsWith(github.head_ref, 'codex/user-team-management-') || startsWith(github.ref_name, 'codex/user-team-management-')
        env:
          DC_MANAGEMENT_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/user-management-browser-smoke.mjs
      - name: Smart Import 3 bilingual desktop and mobile save/reload/assign
        if: env.LAB_AUDIT != 'true' && (startsWith(github.head_ref, 'codex/smart-import-3-') || startsWith(github.ref_name, 'codex/smart-import-3-') || startsWith(github.head_ref, 'codex/smart-import-31-') || startsWith(github.ref_name, 'codex/smart-import-31-'))
        env:
          DC_IMPORT_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/import-browser-smoke.mjs
      - name: Standalone TypeScript
        run: npm run typecheck
      - name: Offline cardio migration and native contracts
        if: env.CARDIO_CHECKS == 'true'
        run: node --experimental-strip-types --test tests/cardio-migration*.test.mjs tests/native-activity-client.test.mjs
      - name: Select runner cardio browser
        if: env.CARDIO_CHECKS == 'true'
        timeout-minutes: 1
        run: |
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          echo "CARDIO_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Cardio English and Hebrew mobile browser contracts
        if: env.CARDIO_CHECKS == 'true'
        run: node scripts/cardio-browser-smoke.mjs
      - name: Select runner anatomy browser
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        timeout-minutes: 1
        run: |
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          echo "ANATOMY_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
      - name: Anatomy viewer controls and bundled model smoke
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/viewer-controls-smoke.mjs
      - name: Reusable joint movement library and atlas lifecycle
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/joint-motion-smoke.mjs
      - name: Full anatomy application browser smoke
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/browser-smoke.mjs
      - name: Anatomical exercise motion controls and lifecycle
        if: env.ANATOMY_BROWSER_CHECKS == 'true'
        run: node scripts/anatomy/exercise-motion-smoke.mjs
      - name: Audit OAuth provider UI with synthetic fixtures
        if: env.LAB_AUDIT == 'true'
        env:
          DC_OAUTH_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/oauth-browser-smoke.mjs
      - name: Audit importer component with synthetic files
        if: env.LAB_AUDIT == 'true'
        env:
          DC_IMPORT_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/import-browser-smoke.mjs
      - name: Build standalone without deployment
        env:
          DC_ISOLATED_STAGING_BUILD: "true"
        run: npm run build:standalone
      - name: Verify isolated LAB deployment target
        run: node standalone/scripts/check-isolated-staging.mjs dist/server/wrangler.json
      - name: Synthetic Worker authentication and authorization checks
        run: node --experimental-strip-types standalone/scripts/runtime-smoke.mjs
      - name: Audit built app sign-in entrypoints and language return
        if: env.LAB_AUDIT == 'true'
        env:
          DC_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/auth-entrypoints-smoke.mjs
      - name: Audit Premium Home across palettes and viewports
        if: env.LAB_AUDIT == 'true'
        env:
          DC_CHROMIUM: /usr/bin/google-chrome
        run: node --experimental-strip-types scripts/premium-home-smoke.mjs
      - name: Package user management LAB candidate without deployment
        if: env.LAB_AUDIT == 'true' || startsWith(github.head_ref, 'fix/consultation-calendar-') || startsWith(github.ref_name, 'fix/consultation-calendar-') || startsWith(github.head_ref, 'codex/trainee-guidance-') || startsWith(github.ref_name, 'codex/trainee-guidance-') || startsWith(github.head_ref, 'codex/user-team-management-') || startsWith(github.ref_name, 'codex/user-team-management-')
        run: |
          mkdir -p .sites-runtime/user-management-release/migrations
          git rev-parse HEAD > .sites-runtime/user-management-release/source-commit.txt
          cp drizzle/0060_calendar_delivery_receipts.sql drizzle/0059_management_assignment_provenance.sql standalone/migrations/0002_user_management.sql standalone/migrations/0003_trainee_guidance.sql .sites-runtime/user-management-release/migrations/
          tar -czf .sites-runtime/user-management-release/lab-candidate.tgz dist
          (cd .sites-runtime/user-management-release && sha256sum lab-candidate.tgz source-commit.txt migrations/*.sql > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Save management candidate and synthetic browser evidence
        if: env.LAB_AUDIT == 'true' || startsWith(github.head_ref, 'fix/consultation-calendar-') || startsWith(github.ref_name, 'fix/consultation-calendar-') || startsWith(github.head_ref, 'codex/trainee-guidance-') || startsWith(github.ref_name, 'codex/trainee-guidance-') || startsWith(github.head_ref, 'codex/user-team-management-') || startsWith(github.ref_name, 'codex/user-team-management-')
        uses: actions/upload-artifact@v4
        with:
          name: user-management-lab-candidate-${{ github.sha }}
          path: |
            apps/doctorcoach-standalone/.sites-runtime/user-management-release/
            apps/doctorcoach-standalone/.sites-runtime/user-management-evidence/
          include-hidden-files: true
          retention-days: 7
      - name: Package verified isolated LAB candidate
        if: env.CARDIO_CHECKS == 'true' || startsWith(github.ref_name, 'codex/import-integration-lab-') || startsWith(github.head_ref, 'codex/import-integration-lab-') || startsWith(github.ref_name, 'codex/application-audit-') || startsWith(github.head_ref, 'codex/application-audit-') || github.ref == 'refs/heads/feature/ui-ux-liad-followup-20261019' || github.head_ref == 'feature/lab-apple-anatomy-integration-20261020' || github.ref == 'refs/heads/feature/doctorcoach-2-smart-workout-20261020'
        run: |
          mkdir -p .sites-runtime/lab-release
          git rev-parse HEAD > .sites-runtime/lab-release/source-commit.txt
          node standalone/scripts/candidate-hash.mjs . > .sites-runtime/lab-release/source-hash.txt
          node standalone/scripts/cardio-migration-preflight.mjs manifest > .sites-runtime/lab-release/migration-manifest.json
          node standalone/scripts/cardio-migration-preflight.mjs rehearse > .sites-runtime/lab-release/migration-rehearsal.json
          mkdir -p .sites-runtime/lab-release/migrations
          cp drizzle/0053_embedded_warmup_sets.sql drizzle/0054_load_metadata.sql drizzle/0055_cardio.sql drizzle/0056_activity.sql drizzle/0057_cardio_weekly.sql .sites-runtime/lab-release/migrations/
          tar -czf .sites-runtime/lab-release/lab-candidate.tgz dist
          (cd .sites-runtime/lab-release && sha256sum lab-candidate.tgz source-commit.txt source-hash.txt migration-manifest.json migration-rehearsal.json migrations/*.sql > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Save verified LAB candidate without deployment
        if: env.CARDIO_CHECKS == 'true' || startsWith(github.ref_name, 'codex/import-integration-lab-') || startsWith(github.head_ref, 'codex/import-integration-lab-') || startsWith(github.ref_name, 'codex/application-audit-') || startsWith(github.head_ref, 'codex/application-audit-') || github.ref == 'refs/heads/feature/ui-ux-liad-followup-20261019' || github.head_ref == 'feature/lab-apple-anatomy-integration-20261020' || github.ref == 'refs/heads/feature/doctorcoach-2-smart-workout-20261020'
        uses: actions/upload-artifact@v4
        with:
          name: isolated-lab-candidate-${{ github.sha }}
          path: apps/doctorcoach-standalone/.sites-runtime/lab-release/
          include-hidden-files: true
          retention-days: 7
      - name: Save cardio browser evidence
        if: always() && env.CARDIO_CHECKS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cardio-browser-evidence-${{ github.sha }}
          path: apps/doctorcoach-standalone/.sites-runtime/cardio-browser-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save anatomy browser evidence
        if: always() && env.ANATOMY_BROWSER_CHECKS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-browser-evidence-${{ github.sha }}
          path: |
            /tmp/dc-anatomy-evidence/
            /tmp/dc-joint-evidence/
            /tmp/dc-exercise-motion-evidence/
            /tmp/dc-viewer-evidence/
          if-no-files-found: ignore
          retention-days: 7
