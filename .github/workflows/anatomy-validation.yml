name: Anatomy validation (isolated)
on:
  push:
    branches:
      - feature/anatomy-asset-safety-stage36
    paths:
      - 'apps/doctorcoach-standalone/**'
      - '.github/workflows/anatomy-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anatomy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/doctorcoach-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          package_json_file: apps/doctorcoach-standalone/package.json
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript and complete unit suite
        run: npm run typecheck && npm test
      - name: Build isolated LAB candidate (no deployment)
        run: npm run build:standalone && node standalone/scripts/check-isolated-staging.mjs dist/server/wrangler.json
        env:
          DC_ISOLATED_STAGING_BUILD: 'true'
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Render and interact with the actual app
        run: npm run test:anatomy:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-browser-evidence
          path: /tmp/dc-anatomy-evidence/
          if-no-files-found: ignore
